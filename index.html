<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Лес Течиса</title><link rel="stylesheet" href="style.css"></head><body><main>
<section id="menu" class="panel"><h1>ЛЕС ТЕЧИСА</h1><p id="skin">Классический скин</p><button data-l="easy">🌱 ЛЕГКО <small>3:00</small><em id="r-easy">Рекорд: —</em></button><button data-l="medium">💣 СРЕДНЕ <small>5:00</small><em id="r-medium">Рекорд: —</em></button><button data-l="hard">🔥 СЛОЖНО <small>8:00</small><em id="r-hard">Рекорд: —</em></button><button id="set">⚙ НАСТРОЙКИ</button></section>
<section id="settings" class="panel hide"><h2>НАСТРОЙКИ</h2><p>Выбор фона и скина</p><div class="themes"><button data-t="red">🔴 Хвойный лес<small>Классический</small></button><button data-t="blast">🔥 Взрывной лес<small>Аркановый</small></button><button data-t="enchanted">🦉 Заколдованный<small>Сова</small></button><button data-t="winter">🐧 Зимний лес<small>Пингвин</small></button><button data-t="farm">🌾 Поле воронов<small>Фермерский</small></button></div><div class="setting-row">
  <div><b>📳 Вибрация флажка</b><small>Только на поддерживаемых телефонах</small></div>
  <label class="switch"><input id="vibration-toggle" type="checkbox"><span class="slider"></span></label>
</div>
<button id="setback">← НАЗАД</button></section>
<section id="game" class="hide"><header><button id="back">← Меню</button><b>💣 <span id="left"></span></b><b>⏳ <span id="time"></span></b><div class="game-actions"><button id="pause" title="Пауза">⏸</button><button id="restart" title="Начать заново">↻</button></div></header><h2 id="title"></h2><div id="wrap"><div id="board"></div></div><p class="hint">ПК: ЛКМ — открыть · ПКМ — флаг · клик по открытой цифре — открыть соседние<br>Телефон: касание — открыть · удержание — флаг</p></section></main>
<div id="ambient" aria-hidden="true"></div><div id="pause-screen" class="pause-screen hide"><div><h2>ПАУЗА</h2><p>Поле скрыто, таймер остановлен.</p><button id="resume">▶ ПРОДОЛЖИТЬ</button></div></div><div id="modal" class="modal hide"><div><h2 id="mt"></h2><p id="mx"></p><button id="again">Играть ещё</button><button id="tomenu">В меню</button></div></div><script src="game.js"></script></body></html>
